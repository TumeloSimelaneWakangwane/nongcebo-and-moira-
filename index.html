<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nongcebo & Moira</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #220c3d;
      --bg-bottom: #0a0312;
      --sidebar-bg: rgba(12, 4, 22, 0.85);
      --glass-card: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f3effa;
      --text-muted: #a79ab8;
      --nongcebo-red: #ff4757;
      --nongcebo-bg: rgba(255, 71, 87, 0.1);
      --moira-blue: #66c7ff;
      --moira-bg: rgba(102, 199, 255, 0.1);
      --accent-purple: #8c52ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(160deg, var(--bg-top) 0%, #140626 45%, var(--bg-bottom) 100%);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ChatGPT-Style Left Sidebar */
    aside {
      width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 18px;
      flex-shrink: 0;
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(90deg, var(--nongcebo-red), #d8b4fe, var(--moira-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 4px 0 0;
      line-height: 1.4;
    }

    .new-chat-btn {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .new-chat-btn:hover {
      background: rgba(255, 255, 255, 0.13);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .persona-legend {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 0.82rem;
    }

    .legend-item strong { display: block; margin-bottom: 2px; font-size: 0.88rem; }
    .legend-n strong { color: var(--nongcebo-red); }
    .legend-m strong { color: var(--moira-blue); }
    .legend-item span { color: var(--text-muted); line-height: 1.4; display: block; }

    .key-box {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .key-box label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .key-box input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.82rem;
      outline: none;
    }

    .key-box input:focus { border-color: var(--accent-purple); }

    /* Main Chat Area */
    .main-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    #chat-stream {
      flex: 1;
      overflow-y: auto;
      padding: 36px 24px 150px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .welcome-screen {
      margin: auto;
      text-align: center;
      max-width: 620px;
      padding: 20px;
    }

    .welcome-screen h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.1rem;
      margin: 0 0 12px;
      color: #fff;
    }

    .welcome-screen p {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.65;
      margin-bottom: 28px;
    }

    .starter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .starter-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      padding: 14px 16px;
      border-radius: 14px;
      color: var(--text-main);
      text-align: left;
      font-size: 0.86rem;
      line-height: 1.45;
      cursor: pointer;
      transition: all 0.2s;
    }

    .starter-card:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: var(--accent-purple);
      transform: translateY(-2px);
    }

    /* Message Bubbles */
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: fadeSlide 0.3s ease forwards;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { align-self: flex-end; }
    .msg-row.ai { align-self: flex-start; }

    .msg-bubble {
      padding: 18px 22px;
      border-radius: 18px;
      line-height: 1.7;
      font-size: 0.98rem;
    }

    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, #5b21b6, #3b0764);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .msg-row.nongcebo .msg-bubble {
      background: var(--nongcebo-bg);
      border: 1px solid rgba(255, 71, 87, 0.35);
      border-left: 4px solid var(--nongcebo-red);
      color: var(--nongcebo-red);
      border-bottom-left-radius: 4px;
    }

    .msg-row.moira .msg-bubble {
      background: var(--moira-bg);
      border: 1px solid rgba(102, 199, 255, 0.35);
      border-left: 4px solid var(--moira-blue);
      color: var(--moira-blue);
      border-bottom-left-radius: 4px;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 14px;
    }

    .msg-author {
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .listen-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .listen-btn:hover { background: rgba(255, 255, 255, 0.2); }

    .thinking-indicator {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-style: italic;
      padding: 6px 12px;
    }

    /* Bottom Input Dock */
    .input-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 24px 26px;
      background: linear-gradient(to top, var(--bg-bottom) 70%, transparent);
    }

    .input-box {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(26, 10, 46, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }

    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 0.98rem;
      resize: none;
      height: 44px;
      padding: 10px 6px;
      outline: none;
    }

    .input-box textarea::placeholder { color: var(--text-muted); }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .icon-btn:hover { background: rgba(255, 255, 255, 0.18); }
    .icon-btn.recording { background: var(--nongcebo-red); border-color: var(--nongcebo-red); animation: pulse 1s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .send-btn {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      color: #fff;
      border: none;
      padding: 0 22px;
      height: 42px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .send-btn:hover { opacity: 0.9; }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      aside { width: 100%; border-right: none; border-bottom: 1px solid var(--glass-border); padding: 14px; }
      .persona-legend { display: none; }
      .msg-row { max-width: 92%; }
    }
  </style>
</head>
<body>

<aside>
  <div>
    <h1 class="brand-title">Nongcebo & Moira</h1>
    <p class="brand-sub">Two voices. Honest truth & unwavering belief.</p>
  </div>

  <button class="new-chat-btn" onclick="startNewChat()">+ New Conversation</button>

  <div class="persona-legend">
    <div class="legend-item legend-n">
      <strong>Nongcebo • The Realist</strong>
      <span>Gives you the straight, unfiltered facts. Holds you accountable to the work your dreams require.</span>
    </div>
    <div class="legend-item legend-m">
      <strong>Moira • The Believer</strong>
      <span>Reassures your spirit, reminds you of your capability, and helps you dream without limits.</span>
    </div>
  </div>

  <div class="key-box">
